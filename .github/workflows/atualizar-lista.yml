
name: Atualizar lista IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-lista-iptv
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar listas
        uses: actions/checkout@v4

      - name: Gerar lista unica
        run: |
          python - <<'PY'
          import urllib.request
          from pathlib import Path

          urls = [
              "https://raw.githubusercontent.com/Ramys/Iptv-Brasil-2026/refs/heads/master/Filmes-Series.m3u8",
              "https://raw.githubusercontent.com/Ramys/Iptv-Brasil-2026/refs/heads/master/CanaisBR01.m3u8",
              "https://raw.githubusercontent.com/Ramys/Iptv-Brasil-2026/refs/heads/master/CanaisBR04.m3u8",
          ]

          resultado = []

          for url in urls:
              req = urllib.request.Request(
                  url, headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req, timeout=180) as r:
                  texto = r.read().decode("utf-8-sig")

              linhas = texto.splitlines()
              if not any(x.strip().startswith("#EXTINF") for x in linhas):
                  raise RuntimeError("Lista invalida: " + url)

              resultado.extend(
                  x for x in linhas
                  if x.strip() and x.strip() != "#EXTM3U"
              )

          Path("lista.m3u").write_text(
              "#EXTM3U\n" + "\n".join(resultado) + "\n",
              encoding="utf-8"
          )
          print("Lista criada:", Path("lista.m3u").stat().st_size, "bytes")
          PY

      - name: Publicar na Release do GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="lista-iptv"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Lista IPTV" \
              --notes "Lista M3U atualizada automaticamente."
          fi

          gh release upload "$TAG" lista.m3u --clobber
